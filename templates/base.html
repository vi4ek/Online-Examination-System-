<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}ExamPro SPPU MCA — Online Examination System{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    @layer base {
      html, body { margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-highest": "#e4e2e4",
            "on-primary-container": "#fcfbff",
            "primary-fixed-dim": "#abc7ff",
            "surface-bright": "#fcf8fb",
            "on-tertiary": "#ffffff",
            "on-secondary-fixed-variant": "#3f484f",
            "tertiary": "#9b3f00",
            "surface-container-high": "#eae7ea",
            "on-secondary": "#ffffff",
            "surface-container-low": "#f6f3f5",
            "error-container": "#ffdad6",
            "on-primary-fixed": "#001b3f",
            "on-tertiary-fixed": "#341000",
            "on-secondary-container": "#5b646b",
            "secondary": "#565f67",
            "on-background": "#1b1b1d",
            "tertiary-container": "#c25100",
            "on-surface-variant": "#414753",
            "outline-variant": "#c1c6d6",
            "on-secondary-fixed": "#141d23",
            "secondary-fixed": "#dbe4ec",
            "surface-dim": "#dcd9dc",
            "tertiary-fixed": "#ffdbcb",
            "on-error": "#ffffff",
            "surface-container-lowest": "#ffffff",
            "outline": "#717785",
            "secondary-container": "#d8e1ea",
            "on-tertiary-fixed-variant": "#7a3000",
            "inverse-surface": "#303032",
            "background": "#fcf8fb",
            "inverse-on-surface": "#f3f0f2",
            "on-primary-fixed-variant": "#00458f",
            "inverse-primary": "#abc7ff",
            "on-error-container": "#93000a",
            "secondary-fixed-dim": "#bec8d0",
            "on-tertiary-container": "#fffaf9",
            "on-surface": "#1b1b1d",
            "surface-container": "#f0edef",
            "primary": "#0059b5",
            "primary-fixed": "#d7e2ff",
            "tertiary-fixed-dim": "#ffb693",
            "primary-container": "#0071e3",
            "on-primary": "#ffffff",
            "surface-variant": "#e4e2e4",
            "surface-tint": "#005cbb",
            "error": "#ba1a1a",
            "surface": "#fcf8fb"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          spacing: {
            "gutter": "1.5rem",
            "margin": "2rem",
            "space-md": "1rem",
            "space-sm": "0.75rem",
            "space-xs": "0.5rem",
            "space-lg": "1.5rem",
            "space-xl": "2rem"
          },
          fontFamily: {
            "body-md": ["Inter", "sans-serif"],
            "headline-md": ["Inter", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "title": ["Inter", "sans-serif"],
            "headline-lg": ["Inter", "sans-serif"],
            "label-md": ["Inter", "sans-serif"],
            "headline-xl": ["Inter", "sans-serif"],
            "body-lg": ["Inter", "sans-serif"],
            "label-sm": ["Inter", "sans-serif"]
          },
          fontSize: {
            "body-md": ["15px", { lineHeight: "22px", fontWeight: "400" }],
            "headline-md": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "body-sm": ["13px", { lineHeight: "18px", fontWeight: "400" }],
            "title": ["17px", { lineHeight: "24px", letterSpacing: "-0.005em", fontWeight: "600" }],
            "headline-lg": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "600" }],
            "label-md": ["14px", { lineHeight: "20px", fontWeight: "500" }],
            "headline-xl": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }],
            "body-lg": ["17px", { lineHeight: "26px", fontWeight: "400" }],
            "label-sm": ["12px", { lineHeight: "16px", fontWeight: "500" }]
          }
        }
      }
    };
  </script>
  {% block head %}{% endblock %}
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased {% block body_class %}{% endblock %}">
  {% block layout %}
    {% block content %}{% endblock %}
  {% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
